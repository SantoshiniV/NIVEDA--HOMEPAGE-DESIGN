    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Account</title>
    <link rel="stylesheet" href="../CSS/style-account.css">
</head>
<body>
    <div class="sections">
          <a href="../HTML/home.html" class="sections-content">
             <span>Home</span>
          </a>
          <a href="../HTML/shop.html" class="sections-content">
              <span>Shop</span>
          </a>
          <a href="../HTML/deals.html" class="sections-content">
               <span>Deals</span>
           </a>    
          <a href="../HTML/newarrivals.html" class="sections-content">
                <span>New Arrivals</span>
          </a>
          <a href="../HTML/brands.html" class="sections-content">
                 <span>Brands</span>
          </a>       
            <span>Inspiration</span>
          <a href="../HTML/account.html" class="sections-content">
             <span>Track Order</span>
          </a>
          </div>

    <main class="account-card">
        <!-- Profile Banner -->
        <header class="profile-header">
            <div class="avatar">S</div>
            <div class="profile-meta">
                <h2>Sammy</h2>
                <p>Personal Profile Settings</p>
            </div>
        </header>

        <!-- Edit Form -->
        <section class="profile-body">
            <form action="#" method="POST">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" value="Sam" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" value="sammy" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" value="sam.sammy@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" value="+91 9876543210">
                    </div>
                    <div class="form-group full-width">
                        <label for="bio">Biography</label>
                        <textarea id="bio" name="bio" rows="4">Software engineer based in India.</textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </section>
    </main>


</body>

</html>
    
</body>
